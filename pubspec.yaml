name: loyalty_pocket
description: An offline loyalty-card wallet for Android and iOS.
publish_to: 'none'
version: 0.4.1+6

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  barcode_widget: ^2.0.4
  characters: ^1.4.0
  crypto: ^3.0.8
  cryptography: ^2.9.0
  file_selector: ^1.0.4
  image_picker: 1.2.2
  mobile_scanner: ^7.0.1
  nsd: 5.0.0
  path_provider: ^2.1.5
  share_plus: 12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
